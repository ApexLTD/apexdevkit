[project]
name = "apexdevkit"
version = "2.1.4"
description = "Apex Development Tools for python."
readme = "README.md"
authors = [
    { name = "Apex Dev", email = "dev@apex.ge" },
]
requires-python = ">=3.12,<4"
dynamic = [
    "dependencies",
]

[tool.poetry.dependencies]
fastapi = "*"
pydantic = "*"
pymssql = "2.*"
pypebbles = "0.4.*"
python-dotenv = "*"
sentry-sdk = { extras = [ "fastapi" ], version = "*" }
uvicorn = "*"

[tool.poetry.group.dev.dependencies]
apexcodexpy = "0.8.*"
coverage = "*"
faker = "*"
pytest = "*"
pytest-approvaltests = "*"
pytest-cov = "*"
pytest-env = "*"
pytest-recording = "*"

[tool.ruff.lint.per-file-ignores]
"apexdevkit/fastapi/resource.py" = [ "N803" ]
"apexdevkit/fastapi/dependable.py" = [ "N806" ]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint]
select = [
    "A",
    "ARG",
    "B",
    "C4",
    "DTZ",
    "E",
    "F",
    "FBT",
    "FLY",
    "FURB",
    "I",
    "LOG",
    "N",
    "PERF",
    "PGH",
    "PIE",
    "PL",
    "PT",
    "PTH",
    "PYI",
    "RET",
    "RSE",
    "RUF",
    "SIM",
    "SLF",
    "T20",
    "TCH",
    "TRY",
    "UP",
    "W",
]
ignore = [
    "PGH",
    "PLR2004",
    "PYI",
    "TRY003",
]

[tool.mypy]
exclude = [
    "apexdevkit/fastapi/dependable.py",
    "apexdevkit/fastapi/resource.py",
    "apexdevkit/fastapi/schema.py",
]
ignore_missing_imports = true
strict = true
pretty = true
show_error_codes = true

[tool.pytest]
env = [
    "ECHO_SERVER=http://localhost:8080",
]

[tool.coverage.run]
source = [
    "apexdevkit",
    "tests",
]
branch = true

[tool.coverage.report]
skip_covered = true
skip_empty = true
show_missing = true
