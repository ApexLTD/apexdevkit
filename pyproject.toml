[project]
name = "apexdevkit"
version = "1.32.7"
description = "Apex Development Tools for python."
readme = "README.md"
authors = [
    { name = "Apex Dev", email = "dev@apex.ge" }
]
dynamic = ["dependencies"]
requires-python = ">=3.11,<4"

[tool.poetry.dependencies]
fastapi = "*"
httpx = "*"
python-dotenv = "*"
pymssql = "2.*"
pydantic = "*"
sentry-sdk = { extras = ["fastapi"], version = "*" }
uvicorn = "*"

[tool.poetry.group.dev.dependencies]
apexcodexpy = "0.6.5"
pytest = "*"
pytest-approvaltests = "*"
pytest-cov = "*"
pytest-env = "*"
pytest-recording = "*"
coverage = "*"
faker = "*"

[tool.mypy]
ignore_missing_imports = true
strict = true
exclude = [
    "apexdevkit/fastapi/schema.py",
    "apexdevkit/fastapi/dependable.py",
]
show_error_codes = true
pretty = true

[tool.deptry]
extend_exclude = [
    "apexdevkit/testing",
]

[tool.ruff.lint]
select = [
    "A",
    "ARG",
    "B",
    "C4",
    "PT",
    "RSE",
    "RET",
    "SIM",
    "T20",
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
]

[tool.ruff.lint.per-file-ignores]
"apexdevkit/fastapi/resource.py" = ["N803"]
"apexdevkit/fastapi/dependable.py" = ["N806"]


[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.coverage.run]
branch = true
source = [
    "apexdevkit",
    "tests",
]

[tool.coverage.report]
skip_empty = true
skip_covered = true
show_missing = true

[tool.pytest]
env = [
    "ECHO_SERVER=http://httpbin.org"
]
